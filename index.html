<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Open in JangaFX Build Hub</title>
<!--
  The page "Copy link" in the JangaFX Build Hub points to (config links.webBase):
  https://<this page>#<build id>. Chat apps make https links clickable, and this
  page hands the build to the app through its jangafx-hub:// link. It reads
  nothing from anywhere and sends nothing anywhere; the build id stays in the
  part of the address after #, which browsers don't send to the server.
-->
<style>
  :root { color-scheme: dark; --text: #fff; --dim: rgba(255,255,255,.6); --faint: rgba(255,255,255,.42); --panel: #1a1c1e; --brand: #0071e3; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--text);
    font: 15px/1.5 "Hando", "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
  .card { width: min(460px, 100%); background: var(--panel); border-radius: 16px; padding: 28px 24px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 6px; font-weight: 650; letter-spacing: -.01em; }
  p { margin: 0 0 18px; color: var(--dim); }
  code { font: 12.5px/1.4 ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; color: var(--faint); word-break: break-all; }
  a.btn { display: inline-block; background: var(--brand); color: #fff; text-decoration: none; font-weight: 600;
    padding: 10px 22px; border-radius: 999px; margin: 4px 0 16px; }
  a.btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .small { font-size: 13px; color: var(--faint); margin: 0; }
  .bad { color: #ff6b6b; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1 id="title">Opening the JangaFX Build Hub…</h1>
    <p id="what">If your browser asks, allow it to open the JangaFX Build Hub.</p>
    <a class="btn" id="open" href="#">Open in Build Hub</a>
    <p class="small"><code id="id"></code></p>
    <p class="small" id="help">Nothing happening? Install the Build Hub first: ask whoever runs it at JangaFX for the installer.</p>
  </div>
</main>
<script>
  (function () {
    var id = decodeURIComponent((location.hash || "").replace(/^#/, "")).replace(/^build\//, "").trim();
    var ok = /^[A-Za-z0-9][A-Za-z0-9._-]{0,119}$/.test(id);
    var open = document.getElementById("open");
    if (!ok) {
      document.getElementById("title").textContent = "This link is incomplete";
      document.getElementById("what").innerHTML = 'Copy it again with <b>Copy link</b> in the Build Hub.';
      document.getElementById("what").className = "bad";
      open.style.display = "none";
      document.getElementById("help").style.display = "none";
      return;
    }
    var target = "jangafx-hub://build/" + id;
    open.href = target;
    document.getElementById("id").textContent = id;
    // Try right away; the button is there if the browser wants a click first.
    setTimeout(function () { location.href = target; }, 150);
  })();
</script>
</body>
</html>
